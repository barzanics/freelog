<html>
<head>
    <meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
    <script type="text/javascript" src="jquery-1.2.6.min.js"></script>
    <script type="text/javascript" >
        function getURLParameter(name) { return decodeURIComponent((new RegExp('[?|&]' + name + '=' + '([^&;]+?)(&|#|;|$)').exec(location.search)||[,""])[1].replace(/\+/g, '%20'))||null}

        mode = getURLParameter('mode');
        if (!mode) mode = '';

        utc = getURLParameter('utc');
        if (!utc) utc = '';

        url_images = "mode" + mode + "/";

        $(window).load(function() {
            $('#clock').css('backgroundImage', 'url(' + url_images + 'ClockFace.png)');
            $('#sec').css('background-image', 'url(' + url_images + 'Seconds.png)');
            $('#min').css('background-image', 'url(' + url_images + 'Minutes.png)');
            $('#hour').css('background-image', 'url(' + url_images + 'Hours.png)');
        });

        $(document).ready(function () {
            setInterval(function () {

                var seconds = new Date().getSeconds();
                var hours = new Date().getHours();
                var mins = new Date().getMinutes();

                var sdegree = seconds * 6;
                var hdegree = hours * 30 + (mins / 2);
                var mdegree = mins * 6;

                var srotate = 'rotate(' + sdegree + 'deg)'; $('#sec').css({ '-moz-transform': srotate, '-webkit-transform': srotate });
                var hrotate = 'rotate(' + hdegree + 'deg)'; $('#hour').css({ '-moz-transform': hrotate, '-webkit-transform': hrotate });
                var mrotate = 'rotate(' + mdegree + 'deg)'; $('#min').css({ '-moz-transform': mrotate, '-webkit-transform': mrotate });
            }, 1000);
        });
    </script>
    <style type='text/css'>
        * {
            margin: 0;
            padding: 0;
        }

        #clock {
            position: relative;
            width: 50%;
            height: 100%;
            list-style: none;
            background: no-repeat center center ;-webkit-background-size: cover;-moz-background-size: cover;-o-background-size: cover;background-size: cover;
        }

        #sec, #min, #hour {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: no-repeat center center ;-webkit-background-size: cover;-moz-background-size: cover;-o-background-size: cover;background-size: cover;
        }

        #sec {
            z-index: 3;
        }

        #min {
            z-index: 2;
        }

        #hour {
            z-index: 1;
        }

        p {
            text-align: center;
            padding: 10px 0 0 0;
        }
    </style>
</head>
<body>
    <ul id="clock" class="clock"> 	   	<li id='sec'></li> 	   	<li id='hour'></li> 		<li id='min'></li> 	</ul>
</body>
</html>
